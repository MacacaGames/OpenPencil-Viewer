name: Verify and publish Portal to GHCR

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install pinned dependencies
        run: |
          npm install --global bun@1.4.2
          bun install --frozen-lockfile
      - name: Verify pinned upstream
        run: npm run verify-upstream
      - name: Test synthetic NAS probes
        run: |
          python3 scripts/probe-nas.py --self-test
          python3 tests/nas/test_bridge.py
          python3 tests/nas/test_dsm_query_format.py
      - name: Check Portal types and formatting
        run: |
          npm run typecheck
          npm run format:check
      # /scene integration tests use the bundled native parser worker.
      # A fresh checkout has no dist/api/scene-parser.js until this build.
      - name: Build native UI and server scene parser
        run: npm run build
      - name: Test Portal API and readonly boundaries
        run: npm test
      - name: Check native editor types and graph immutability
        run: |
          npm run typecheck:editor
          npm run test:adapter
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Test native readonly browser flow
        run: npm run test:e2e
      - name: Verify source integrity
        run: |
          git -C upstream/open-pencil diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-results
          path: test-results/report.json
          retention-days: 7

  image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Choose lowercase image name
        id: name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build target platform for local verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ steps.name.outputs.image }}:ci-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Verify target image on synthetic roots
        env:
          PORTAL_TEST_IMAGE: ${{ steps.name.outputs.image }}:ci-${{ github.sha }}-${{ matrix.arch }}
        run: sh tests/container/readonly.sh
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the already tested image and record digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.name.outputs.image }}:ci-${{ github.sha }}-${{ matrix.arch }}
        run: |
          docker push "$IMAGE"
          mkdir -p .work/digests
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE" > .work/digests/${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image-digest-${{ matrix.arch }}
          path: .work/digests/${{ matrix.arch }}.txt
          retention-days: 7

  manifest:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose lowercase image name
        id: name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: .work/digests
      - name: Publish multi-platform manifest from verified digests
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          refs=()
          for arch in amd64 arm64; do
            ref=$(cat ".work/digests/$arch.txt")
            digest=${ref#"$IMAGE@sha256:"}
            [[ "$ref" == "$IMAGE@sha256:"* && "$digest" =~ ^[0-9a-f]{64}$ ]]
            refs+=("$ref")
          done
          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(--tag "$tag")
          done <<< "$TAGS"
          (( ${#tags[@]} > 0 ))
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          {
            echo 'Published arm64/amd64 images after synthetic readonly checks.'
            echo 'NAS native authorization is still blocked; publication does not enable formal documents.'
          } >> "$GITHUB_STEP_SUMMARY"
