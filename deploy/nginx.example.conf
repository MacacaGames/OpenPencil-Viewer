# Include inside a LAN-only nginx server with a trusted TLS certificate.
# Replace the example CIDRs and hostname. Keep BFF bound to NAS loopback.
server {
    listen 443 ssl;
    server_name openpencil.macaca.games;
    ssl_certificate /etc/nginx/tls/openpencil.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/openpencil.key;
    allow 192.168.10.0/24;
    deny all;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
