# Include inside an existing trusted TLS reverse proxy. Apply your LAN access policy.
map $http_upgrade $portal_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    server_name openpencil.macaca.games;
    ssl_certificate /etc/nginx/tls/openpencil.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/openpencil.key;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:24681;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portal_connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
