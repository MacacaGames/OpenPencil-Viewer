stages: [verify, image, live]
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: 'true'
  PLAYWRIGHT_BROWSERS_PATH: '$CI_PROJECT_DIR/.work/browsers'
verify_mock:
  stage: verify
  image: node:22.23.3-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 git
    - npm install --global bun@1.4.2
    - bun install --frozen-lockfile
  script:
    - npm run verify-upstream
    - python3 scripts/probe-nas.py --self-test
    - python3 tests/nas/test_bridge.py
    - python3 tests/nas/test_dsm_query_format.py
    - npm run typecheck
    - npm run format:check
    # /scene tests need the bundled parser worker from this build.
    - npm run build
    - npm test
    - npm run typecheck:editor
    - npm run test:adapter
    - bunx --no-install playwright install --with-deps chromium
    - npm run test:e2e
    - git -C upstream/open-pencil diff --exit-code
    - git diff --check
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/report.json, .work/portal-native.png]
# Requires an administrator-approved build runner with Docker; no NAS mounts.
image_synthetic:
  stage: image
  tags: [docker-build]
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  script:
    - docker build -f deploy/Dockerfile -t openpencil-lan-ci:$CI_COMMIT_SHA .
    - PORTAL_TEST_IMAGE=openpencil-lan-ci:$CI_COMMIT_SHA sh tests/container/readonly.sh
# Deliberately exits 2 while the native bridge is unavailable. It is a release gate,
# not a mock substitute and not an unattended SSH/deployment job.
nas_live_gate:
  stage: live
  image: node:22.23.3-bookworm
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  before_script:
    - npm install --global bun@1.4.2
    - bun install --frozen-lockfile
  script:
    - npm run test:nas
